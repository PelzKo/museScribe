# omrbench configuration. Paths are relative to this file.
home: ~/.local/share/omrbench     # where setup.sh put venvs/tools (or $OMRBENCH_HOME)
data_dir: data            # shows: data/<show>/show.yaml (+ songs.xlsx, pdfs/, truth/)
samples_dir: data/samples # single-PDF benchmark samples (omrbench run)
results_dir: results
dpi: 300                  # rasterisation for page-image engines (homr, oemer)
device: auto              # auto (cuda if nvidia-smi works, else cpu) | cpu | cuda
                          # engines with `requires_gpu: true` are skipped when device is cpu
timeout_s: 1800           # per engine call (per page for homr/oemer)
transcribe_jobs: 2        # PDFs transcribed at once (omrbench transcribe --jobs overrides)
musescore_cli: null       # only needed if you drop gt.mscz instead of gt.musicxml

engines:
  audiveris:              # stock settings
    type: audiveris
    # parallel_sheets: false  # true: sheets of a PDF in parallel, ~2x faster, but Audiveris
    #                         # 5.11 then drops symbols / crashes on some PDFs (a race)
  audiveris-meta:         # switches derived from meta.yaml (drums, OCR languages, ...)
    type: audiveris
    use_metadata: true
  homr:
    type: homr
    # workers: auto       # persistent homr processes (auto = CPU threads / threads)
    # threads: 2          # ONNX threads per worker; pool: false = one process per image
    # nice: 0             # >0 lowers the workers' CPU priority (was slower in tests)
  pipeline:               # audiveris-meta layout + homr per staff group + repairs
    type: pipeline
    prefer: auto          # scans: crop (recognizer) bars first; vector PDFs: audiveris bars first
    # recognizer: homr    # crop recognizer (pipeline/recognizer.py)
    # auto_beam: true     # beam unbeamed eighths and shorter by beat (else MuseScore shows flags)
    # max_wedge_bars: 2   # hairpins longer than this are misread pairings and dropped
    # homr: {workers: auto, threads: 2}   # the crop pool (shared by all PDFs of a run); device: cuda to use the GPU (fp16, scored lower)
  pipeline-zeus:          # pipeline with Zeus on single staves and grand staves, homr on larger groups
    type: pipeline
    recognizer: zeus
  pipeline-smt:           # pipeline with SMT system-level grand-staff model on 2-staff groups, homr on the rest
    type: pipeline
    recognizer: smt-sys
  pipeline-transcoda:     # pipeline with Transcoda on 2-staff groups, homr on the rest
    type: pipeline
    recognizer: transcoda
  pipeline-clarity:       # pipeline with Clarity's staff reader on single staves and grand staves, homr on larger groups
    type: pipeline
    recognizer: clarity
  pipeline-ola:           # pipeline + OLA's measure count per system as one more bar-count vote (P6 layout)
    type: pipeline
    measure_vote: ola
  # bar-number OCR engine (P6 OCR component); default ocr_engine: tesseract
  pipeline-easyocr: {type: pipeline, ocr_engine: easyocr}
  pipeline-doctr: {type: pipeline, ocr_engine: doctr}
  pipeline-paddle: {type: pipeline, ocr_engine: paddle}
  # level 2 of the recognizer comparison (PLAN_full.md P6): same crops, bars as read, no repairs
  pipeline-raw: {type: pipeline, repairs: false}
  pipeline-zeus-raw: {type: pipeline, recognizer: zeus, repairs: false}
  pipeline-smt-raw: {type: pipeline, recognizer: smt-sys, repairs: false}
  pipeline-transcoda-raw: {type: pipeline, recognizer: transcoda, repairs: false}
  pipeline-clarity-raw: {type: pipeline, recognizer: clarity, repairs: false}
  clarity:                # Clarity-OMR, whole PDF -> MusicXML; piano-tuned (container only)
    type: clarity
    # beam_width: 5         # default 5; 2 is ~2x faster on CPU
  transcoda:              # Transcoda 59M: full-page pianoform image -> **kern (container only)
    type: transcoda
    # beams: 3              # beam width (paper setting); 1 = greedy, faster
  smt-fp:                 # Sheet Music Transformer, full-page pianoform (PRAIG/smt-fp-grandstaff), bekern
    type: smt-fp
  mozart:                 # classic-CV floor (treble staves only, no rests/barlines)
    type: mozart
    dpi: 150                # its classifier was trained on ~150 dpi excerpts; 300 dpi pages read as empty
  oemer:                  # opt-in (--engines oemer): ~5 min/page, 6 GB RAM on CPU
    type: oemer
    enabled: false

scoring:
  jobs: 4                 # parallel scoring processes (engines always run one at a time)
  metric_timeout_s: 1200  # per metric per (engine, sample)
  omr_ned_variants:       # musicdiff DetailLevel names, combine with "|"
    all: AllObjects
    notes: NotesAndRests  # fair to engines that ignore lyrics/dynamics (homr, oemer)
  tedn: true
  tedn_max_nodes: 2500    # larger parts are scored measure-by-measure (see metrics/tedn.py)
