[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omrbench"
version = "0.1.0"
description = "Benchmark OMR engines (Audiveris, homr, oemer, external) against MusicXML ground truth"
requires-python = ">=3.12"

[project.scripts]
omrbench = "omrbench.cli:main"

[tool.setuptools.packages.find]
include = ["omrbench*"]
