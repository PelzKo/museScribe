# Per-sample metadata. Every key is optional; only keys the harness reads belong here.

# Groups the report. type: drums also turns on Audiveris drumNotation (audiveris-meta).
#   choir            vocal staves only
#   piano            solo keyboard (grand staff)
#   piano_reduction  vocal score: piano at the bottom, a varying number of sung /
#                    spoken lines above it
#   part             single instrumental part
#   orchestral | drums | other
type: choir

# Shown in the report's sample table (e.g. scan / photo / born-digital PDF).
source: "Scan of ... (phone photo / flatbed 300 dpi)"

# Tesseract codes for Audiveris OCR (audiveris-meta variant).
languages: [deu, lat]

# Ground truth split into one file per part (gt-<name>.musicxml, e.g. MuseScore part
# exports): list the <name>s top to bottom as printed. They are stacked into
# gt.prepared.musicxml. Unlisted gt-* files are appended alphabetically.
# gt_parts: [Sopran, Alt, Tenor, Bass]

# Measures (by MusicXML number) that exist in the GT but are not printed, e.g. cuts.
# gt_drop_measures: [12, 13]

# pipeline engine: instruments of a condensed part (percussion), in score order. A shared
# staff is split into one part per instrument at the printed labels; aliases are other
# spellings in the print. Splitting is on for type: drums, or force it:
# split_instruments: true
# instruments:
#   - Timpani
#   - Sus Cymbal
#   - {name: Violin (cue), aliases: ["(Vln)"]}

# Audiveris processing switches for the audiveris-meta variant
# one_line_percussion: true
# small_heads: true
# cross_heads: true
# lyrics: true
# lyrics_above_staff: true
# articulations: true
# implicit_tuplets: true
# chord_names: true
# poor_input: true
# audiveris_constants:         # any other -constant key=value
#   org.audiveris.omr.sheet.ProcessingSwitches.crossHeads: true

# Fill in after correcting each engine's output in MuseScore (minutes).
# manual_entry = time to type the same pages from scratch.
# correction_minutes:
#   manual_entry: 90
#   audiveris: 35
#   homr: 50
